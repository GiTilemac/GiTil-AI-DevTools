[project]
name = "snake-arena-backend"
version = "0.1.0"
description = "FastAPI backend implementing ../openapi.yaml for the Snake Arena frontend"
readme = "README.md"
authors = [
    { name = "Tilemachos Doganis", email = "dtilemac@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "bcrypt>=4.1",
    "sqlalchemy>=2.0",
    "greenlet!=3.5.6",
    "psycopg[binary]>=3.3.6",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
