global:
  scrape_interval: 15s

# Metrics arrive from the collector over OTLP. service.name becomes the
# `job` label; promote the other attributes the app sets so they can be
# used directly as labels.
otlp:
  promote_resource_attributes:
    - service.version
    - deployment.environment.name
    - deployment.environment

storage:
  tsdb:
    # OTLP batches can arrive slightly out of order.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
