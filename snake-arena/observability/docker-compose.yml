# Local observability stack, run as its own Compose project, separate
# from the application stack in ../docker-compose.yml:
#
#   app --OTLP--> OpenTelemetry Collector --> Tempo       (traces)
#                                         --> Prometheus  (metrics)
#                                         --> Loki        (logs)
#                         Grafana reads all three.
#
#   docker compose up -d        # from this directory
#   open http://localhost:3000  # Grafana, admin / admin
#
# Point the app at the collector with OTEL_EXPORTER_OTLP_ENDPOINT (see
# README.md). Only the collector's OTLP ports, Grafana and Prometheus are
# published, all on 127.0.0.1; override the host ports with
# OTLP_GRPC_PORT, OTLP_HTTP_PORT, PROMETHEUS_PORT and GRAFANA_PORT if
# they're taken. For local use only: Grafana's login defaults to
# admin / admin (GRAFANA_ADMIN_PASSWORD overrides it).
name: snake-arena-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
    depends_on:
      - tempo
      - prometheus
      - loki

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # Tempo runs as an unprivileged user that can't write to a fresh
    # named volume; this is a local, single-user stack.
    user: root
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The collector pushes metrics over OTLP instead of being scraped.
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - tempo
      - prometheus
      - loki

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  # Fixed name so the app stack can join it (see compose.app.yml).
  default:
    name: snake-arena-observability
