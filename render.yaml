# Dev environment. Production is a separate, independent copy of this
# infrastructure in render.production.yaml (own service, own database).
# Service names are kept as they were so Render keeps updating the
# existing services instead of creating new ones.
services:
  # Dev: deploys from `main`.
  - type: web
    name: snake-arena
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

  # Dev staging: same image, deployed from the `staging` branch, so
  # changes can be checked against a real deploy before they reach
  # `main`. Shares the dev database with the service above (Render's free
  # tier allows only one active database per workspace).
  - type: web
    name: snake-arena-staging
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: staging
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

databases:
  - name: snake-arena-db
    plan: free
    databaseName: snake_arena
    user: snake
