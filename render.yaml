# Dev and production. Neither builds anything: both pull a prebuilt
# image from GitHub Container Registry, built and pushed by CI's `build`
# job and tagged YYYYMMDD-HHMMSS-shortsha.
#
# Image-backed services don't redeploy on their own. The Deploy workflow
# (.github/workflows/deploy.yml) deploys an exact tag through each
# service's deploy hook, then moves the `dev` / `prod` tag to it. The
# URLs below point at those moving tags, so a Blueprint sync (which
# redeploys from these URLs) lands on the image already running.
#
# Both share one Postgres database (Render's free tier allows only one
# active database), so anything done in dev - signups, scores, CI
# `ci-smoke-*` entries - shows up in production. See
# snake-arena/_docs/deployment.md.
services:
  # Dev: deployed by CI after every push to `main` that passes.
  - type: web
    name: snake-arena
    runtime: image
    image:
      url: ghcr.io/gitilemac/snake-arena:dev
    plan: free
    healthCheckPath: /health
    envVars:
      # OpenTelemetry `deployment.environment.name` (app/telemetry.py).
      - key: DEPLOYMENT_ENVIRONMENT
        value: dev
      # Traces/metrics go to Grafana Cloud over OTLP/HTTP. The auth
      # header holds the Grafana token, so its value is set only in the
      # Render dashboard (sync: false); without it Grafana rejects the
      # data with 401.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

  # Production: deployed only by the Promote workflow
  # (.github/workflows/promote.yml), with the image dev is running.
  - type: web
    name: snake-arena-prod
    runtime: image
    image:
      url: ghcr.io/gitilemac/snake-arena:prod
    plan: free
    healthCheckPath: /health
    envVars:
      # OpenTelemetry `deployment.environment.name` (app/telemetry.py).
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      # Traces/metrics go to Grafana Cloud over OTLP/HTTP. The auth
      # header holds the Grafana token, so its value is set only in the
      # Render dashboard (sync: false); without it Grafana rejects the
      # data with 401.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

databases:
  - name: snake-arena-db
    plan: free
    databaseName: snake_arena
    user: snake
