# Dev environment: deploys every push to `main`. Production is an
# independent copy of this infrastructure in render.production.yaml (own
# service, own database), updated only by the Promote workflow
# (.github/workflows/promote.yml). Service names are kept as they were
# so Render keeps updating the existing services instead of creating
# new ones.
services:
  - type: web
    name: snake-arena
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

databases:
  - name: snake-arena-db
    plan: free
    databaseName: snake_arena
    user: snake
