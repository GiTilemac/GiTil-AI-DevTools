services:
  - type: web
    name: snake-arena
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

  # Staging: same image, deployed from the `staging` branch, so changes
  # can be verified against a real deploy before being promoted to
  # `main` (production, above). Shares production's database (Render's
  # free tier allows only one active database per account) - see the
  # README's Render section for what that trade-off means in practice.
  - type: web
    name: snake-arena-staging
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: staging
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

databases:
  - name: snake-arena-db
    plan: free
    databaseName: snake_arena
    user: snake
