# Dev and production. Both run the same image and share one Postgres
# database (Render's free tier allows only one active database), so
# anything done in dev - signups, scores, CI `ci-smoke-*` entries - shows
# up in production. See snake-arena/_docs/deployment.md.
services:
  # Dev: auto-deploys every push to `main`. Name kept from before so
  # Render keeps updating the existing service.
  - type: web
    name: snake-arena
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

  # Production: deploys from the `production` branch, which only the
  # Promote workflow (.github/workflows/promote.yml) moves, by
  # fast-forwarding it to the commit dev is running. Don't push to it
  # by hand.
  - type: web
    name: snake-arena-prod
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: production
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-db
          property: connectionString

databases:
  - name: snake-arena-db
    plan: free
    databaseName: snake_arena
    user: snake
