name: Deploy

# Render auto-deploys every push to main to the dev environment
# (render.yaml) independently of GitHub Actions (there's no GitHub OIDC
# support in Render - deploys only accept a static API key/deploy-hook
# secret, so we're not driving the deploy from CI). This workflow instead
# confirms the result against the real, live deploy once the CI workflow
# has passed for a push: wait until dev's /health reports the pushed
# commit, then run the same black-box smoke suite used against the local
# Docker Compose stack (signup, submit score, leaderboard, SPA fallback) -
# so a broken deploy surfaces as a failed run, not silently. Each run
# writes a uniquely-named `ci-smoke-*` user/score into dev's leaderboard
# as a side effect.
#
# Production is deployed and verified by the Promote workflow
# (promote.yml), not here.
#
# Note: workflow_run only fires for the copy of this file on the default
# branch (main).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Render service URLs. Render appends a random suffix when a service
# name is taken, so these come from each service's page in the dashboard.
env:
  DEV_URL: https://snake-arena-yl77.onrender.com

defaults:
  run:
    shell: bash

jobs:
  verify-dev-deploy:
    name: Verify dev deploy
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    defaults:
      run:
        working-directory: snake-arena/backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Wait for the commit to be live on dev
        env:
          BASE_URL: ${{ env.DEV_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for i in $(seq 1 90); do
            commit=$(curl -sf "$BASE_URL/health" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$SHA" ]; then
              echo "Dev is healthy and running $SHA"
              exit 0
            fi
            echo "Dev reports commit '${commit:-<none>}', waiting for $SHA"
            sleep 10
          done
          echo "Dev did not report healthy on $SHA within 15 minutes. If a newer commit was pushed meanwhile, this run is superseded." >&2
          exit 1
      - name: Run smoke tests against the live dev deploy
        env:
          BASE_URL: ${{ env.DEV_URL }}
        run: uv run pytest ../integration-tests -v
