name: Deploy

# Deploys one already-built image to one environment. Called by CI
# (ci.yml, dev, after every passing push to main) and by Promote
# (promote.yml, production, with the image dev is running). Nothing is
# built here: Render pulls the image from GitHub Container Registry.
#
# 1. Call the service's Render deploy hook with `imgURL` set to the
#    exact tag. Render requires everything but the tag to match the
#    service's image URL in render.yaml.
# 2. Wait until /health reports that tag. The previous deploy keeps
#    answering /health until the new one is live.
# 3. Move the environment's tag (`dev` / `prod`) to the image, so a
#    Render Blueprint sync, which deploys from those tags, lands on the
#    same image.
# 4. Run the black-box smoke suite (integration-tests/) against it. Each
#    run writes a uniquely-named `ci-smoke-*` user/score into the
#    (shared, see render.yaml) database.
on:
  workflow_call:
    inputs:
      environment:
        description: "`dev` or `production`"
        required: true
        type: string
      tag:
        description: Image tag to deploy (YYYYMMDD-HHMMSS-shortsha)
        required: true
        type: string
      sha:
        description: Full commit SHA the image was built from (for the smoke tests' checkout)
        required: true
        type: string
    secrets:
      deploy_hook:
        description: The target service's Render deploy hook URL
        required: true

# Render service URLs. Render appends a random suffix when a service
# name is taken, so these come from each service's page in the dashboard.
env:
  IMAGE: ghcr.io/gitilemac/snake-arena
  DEV_URL: https://snake-arena-yl77.onrender.com
  PROD_URL: https://snake-arena-prod.onrender.com

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Required reviewers on the `production` GitHub environment, if set,
    # make every production deploy wait for an approval here.
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve the environment
        id: env
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          case "$ENVIRONMENT" in
            dev)        echo "url=$DEV_URL"  >> "$GITHUB_OUTPUT"; echo "moving_tag=dev"  >> "$GITHUB_OUTPUT" ;;
            production) echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"; echo "moving_tag=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown environment '$ENVIRONMENT'" >&2; exit 1 ;;
          esac
          if ! [[ "$TAG" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]]; then
            echo "'$TAG' is not a YYYYMMDD-HHMMSS-shortsha tag" >&2
            exit 1
          fi
          if [ "${TAG##*-}" != "${SHA::7}" ]; then
            echo "Tag $TAG wasn't built from $SHA" >&2
            exit 1
          fi

      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.deploy_hook }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "The deploy hook secret is empty. Set RENDER_DEPLOY_HOOK_DEV / RENDER_DEPLOY_HOOK_PROD (repo Settings > Secrets and variables > Actions) to the hook URL from the service's Settings page in Render." >&2
            exit 1
          fi
          img=$(jq -rn --arg u "$IMAGE:$TAG" '$u | @uri')
          curl -fsS -X POST "$HOOK&imgURL=$img" > /dev/null
          echo "Asked Render to deploy $IMAGE:$TAG"

      - name: Wait for the image to be live
        env:
          BASE_URL: ${{ steps.env.outputs.url }}
          TAG: ${{ inputs.tag }}
        run: |
          for i in $(seq 1 90); do
            version=$(curl -sf "$BASE_URL/health" | jq -r '.version // empty' || true)
            if [ "$version" = "$TAG" ]; then
              echo "$BASE_URL is healthy and running $TAG"
              exit 0
            fi
            echo "$BASE_URL reports '${version:-<none>}', waiting for $TAG"
            sleep 10
          done
          echo "$BASE_URL did not report healthy on $TAG within 15 minutes. Check the deploy's logs in Render." >&2
          exit 1

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move the ${{ steps.env.outputs.moving_tag }} tag to the deployed image
        env:
          TAG: ${{ inputs.tag }}
          MOVING_TAG: ${{ steps.env.outputs.moving_tag }}
        run: docker buildx imagetools create -t "$IMAGE:$MOVING_TAG" "$IMAGE:$TAG"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Run smoke tests against the live deploy
        working-directory: snake-arena/backend
        env:
          BASE_URL: ${{ steps.env.outputs.url }}
        run: |
          uv sync
          uv run pytest ../integration-tests -v
