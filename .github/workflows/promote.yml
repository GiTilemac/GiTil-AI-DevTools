name: Promote to production

# Manually promotes the image dev is running to production. Nothing is
# rebuilt: production gets the exact image dev was verified on.
#
# `prepare` reads the image tag from dev's /health, checks the image is
# in the registry and isn't already in production, and lists what's
# about to ship in the run summary. `deploy` then runs the shared Deploy
# workflow (deploy.yml) against production. If the `production` GitHub
# environment has required reviewers (Settings > Environments), that
# deploy waits for an approval first.
on:
  workflow_dispatch:

concurrency:
  group: promote-production
  cancel-in-progress: false

# Render service URLs, from each service's page in the dashboard.
env:
  IMAGE: ghcr.io/gitilemac/snake-arena
  DEV_URL: https://snake-arena-yl77.onrender.com
  PROD_URL: https://snake-arena-prod.onrender.com

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Find the dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.dev.outputs.tag }}
      sha: ${{ steps.dev.outputs.sha }}
      up_to_date: ${{ steps.prod.outputs.up_to_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Read the image tag dev is running
        id: dev
        run: |
          tag=$(curl -sf "$DEV_URL/health" | jq -r '.version // empty') || {
            echo "Dev at $DEV_URL is not healthy" >&2
            exit 1
          }
          if ! [[ "$tag" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]]; then
            echo "Dev reports version '${tag:-<none>}', which isn't a registry image tag. Has dev been deployed from the registry yet?" >&2
            exit 1
          fi
          sha=$(git rev-parse --verify -q "${tag##*-}^{commit}") || {
            echo "Commit ${tag##*-} from tag $tag isn't in the repo" >&2
            exit 1
          }
          echo "Dev is running $IMAGE:$tag (commit $sha)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check the image is in the registry
        env:
          TAG: ${{ steps.dev.outputs.tag }}
        run: docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null
      - name: Compare with production
        id: prod
        env:
          TAG: ${{ steps.dev.outputs.tag }}
          SHA: ${{ steps.dev.outputs.sha }}
        run: |
          prod=$(curl -sf "$PROD_URL/health" | jq -r '.version // empty' || true)
          echo "Production reports '${prod:-<none>}'"
          if [ "$prod" = "$TAG" ]; then
            echo "Production is already running $TAG; nothing to promote."
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"

          # Summary of what will ship. Production's commit comes from its
          # tag; if it has none (first promotion), list recent commits.
          base=""
          if [[ "$prod" =~ -([0-9a-f]{7})$ ]]; then
            base=$(git rev-parse --verify -q "${BASH_REMATCH[1]}^{commit}" || true)
          fi
          {
            echo "## Promoting \`$TAG\` to production"
            echo
            echo "Production is running \`${prod:-<unknown>}\`."
            echo
            echo "### Commits"
            echo '```'
            if [ -n "$base" ]; then
              git log --oneline -n 50 "$base..$SHA"
            else
              git log --oneline -n 20 "$SHA"
            fi
            echo '```'
            if [ -n "$base" ] && ! git diff --quiet "$base" "$SHA" -- snake-arena/backend/app/db_models.py; then
              echo
              echo "### :warning: Database models changed"
              echo "Dev and production share one database. Make sure any schema change is backward compatible before approving. See \`snake-arena/_docs/release-process.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    needs: prepare
    if: needs.prepare.outputs.up_to_date == 'false'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: production
      tag: ${{ needs.prepare.outputs.tag }}
      sha: ${{ needs.prepare.outputs.sha }}
    secrets:
      deploy_hook: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
