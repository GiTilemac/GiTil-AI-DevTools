name: CI

# Tests on every PR and push to main. On a push to main that passes,
# also the two delivery stages:
#   build      - build the Docker image once and push it to GitHub
#                Container Registry, tagged YYYYMMDD-HHMMSS-shortsha
#   deploy-dev - have Render pull that exact image into dev, wait for it
#                to be live and smoke-test it (deploy.yml)
# Production gets the same image later, via promote.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snake-arena/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snake-arena/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snake-arena/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run

  # Builds and boots the same docker-compose.yml used for local/prod
  # (app + real Postgres), then runs integration-tests/ against it over
  # real HTTP - unlike backend/tests (in-process, in-memory SQLite) or
  # frontend/tests (component-level Vitest).
  integration-e2e:
    name: Integration & e2e tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    defaults:
      run:
        working-directory: snake-arena
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Run integration/e2e smoke tests against the running stack
        working-directory: snake-arena/backend
        run: uv sync && uv run pytest ../integration-tests -v

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute the image tag
        id: tag
        run: |
          tag="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "Image tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: snake-arena
          push: true
          tags: ghcr.io/gitilemac/snake-arena:${{ steps.tag.outputs.tag }}
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Seed the dev/prod tags if missing
        # render.yaml points the services at :dev / :prod, and Render
        # refuses a Blueprint sync while those tags don't exist. Normally
        # deploy.yml moves them after each deploy and this does nothing;
        # it only creates them on first setup (or if they were deleted).
        env:
          IMAGE: ghcr.io/gitilemac/snake-arena
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for moving in dev prod; do
            if docker buildx imagetools inspect "$IMAGE:$moving" > /dev/null 2>&1; then
              echo "$IMAGE:$moving exists; leaving it alone"
            else
              docker buildx imagetools create -t "$IMAGE:$moving" "$IMAGE:$TAG"
              echo "Created $IMAGE:$moving -> $TAG"
            fi
          done

  deploy-dev:
    name: Deploy to dev
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: dev
      tag: ${{ needs.build.outputs.tag }}
      sha: ${{ github.sha }}
    secrets:
      deploy_hook: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
