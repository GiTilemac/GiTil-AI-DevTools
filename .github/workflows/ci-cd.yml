name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

defaults:
  run:
    shell: bash

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snake-arena/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snake-arena/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snake-arena/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run

  # Builds and boots the same docker-compose.yml used for local/prod
  # (app + real Postgres), then runs integration-tests/ against it over
  # real HTTP - unlike backend/tests (in-process, in-memory SQLite) or
  # frontend/tests (component-level Vitest).
  integration-e2e:
    name: Integration & e2e tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    defaults:
      run:
        working-directory: snake-arena
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Run integration/e2e smoke tests against the running stack
        working-directory: snake-arena/backend
        run: uv sync && uv run pytest ../integration-tests -v

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # Render's Blueprint auto-deploys on every push to main/staging
  # independently of this workflow (there's no GitHub OIDC support in
  # Render - deploys only accept a static API key/deploy-hook secret, so
  # we're not driving the deploy from CI). These jobs instead confirm the
  # result against the real, live deploy: wait for it to report healthy,
  # then run the same black-box smoke suite used against the local
  # Docker Compose stack (signup, submit score, leaderboard, SPA
  # fallback) - so a broken deploy surfaces as a failed CI run, not
  # silently. Each writes a uniquely-named `ci-smoke-*` user/score into
  # that environment's real leaderboard as a side effect.
  verify-staging-deploy:
    name: Verify staging deploy
    runs-on: ubuntu-latest
    needs: integration-e2e
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    defaults:
      run:
        working-directory: snake-arena/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Wait for the deploy to become healthy
        env:
          BASE_URL: ${{ vars.RENDER_URL_STAGING }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Set the RENDER_URL_STAGING repo variable (Settings > Secrets and variables > Actions > Variables tab) to https://<your-staging-service>.onrender.com" >&2
            exit 1
          fi
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/health" > /dev/null; then
              echo "Deploy is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed app did not report healthy within the timeout" >&2
          exit 1
      - name: Run smoke tests against the live staging deploy
        env:
          BASE_URL: ${{ vars.RENDER_URL_STAGING }}
        run: uv run pytest ../integration-tests -v

  verify-production-deploy:
    name: Verify production deploy
    runs-on: ubuntu-latest
    needs: integration-e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: snake-arena/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Wait for the deploy to become healthy
        env:
          BASE_URL: ${{ vars.RENDER_URL_PRODUCTION }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Set the RENDER_URL_PRODUCTION repo variable (Settings > Secrets and variables > Actions > Variables tab) to https://<your-production-service>.onrender.com" >&2
            exit 1
          fi
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/health" > /dev/null; then
              echo "Deploy is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed app did not report healthy within the timeout" >&2
          exit 1
      - name: Run smoke tests against the live production deploy
        env:
          BASE_URL: ${{ vars.RENDER_URL_PRODUCTION }}
        run: uv run pytest ../integration-tests -v
