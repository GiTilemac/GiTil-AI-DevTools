# Production: an independent copy of the infrastructure in render.yaml
# (which is now the dev environment). It has its own web service and its
# own Postgres database, so nothing done in dev - test signups, scores,
# CI `ci-smoke-*` entries, schema experiments - reaches production data.
#
# Apply it as a separate Blueprint (New > Blueprint, Blueprint path
# `render.production.yaml`), in its own Render workspace: the free tier
# allows only one active database per workspace, and dev already uses
# it. To run both stacks in one workspace instead, put one of the two
# databases on a paid plan. See snake-arena/_docs/deployment.md.
#
# Deploys from the `production` branch, which is only ever
# fast-forwarded to a commit already verified in dev (see
# snake-arena/_docs/release-process.md).
services:
  - type: web
    name: snake-arena-prod
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: production
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-prod-db
          property: connectionString

databases:
  - name: snake-arena-prod-db
    plan: free
    databaseName: snake_arena
    user: snake
