# Production: an independent copy of the infrastructure in render.yaml
# (which is now the dev environment). It has its own web service and its
# own Postgres database, so nothing done in dev - test signups, scores,
# CI `ci-smoke-*` entries, schema experiments - reaches production data.
#
# Render's free tier allows only one active Postgres database, and dev
# already uses it (Render rejected a second one with "cannot have more
# than one active tier database"). So either put one of the two
# databases on a paid plan - recommended for production anyway, since
# free databases expire - or apply this Blueprint under a separate
# Render account. See snake-arena/_docs/deployment.md.
#
# Deploys from the `production` branch, which only the Promote workflow
# (.github/workflows/promote.yml) moves: it fast-forwards it to the
# commit dev is running. Don't push to it by hand.
services:
  - type: web
    name: snake-arena-prod
    runtime: docker
    rootDir: snake-arena
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: production
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snake-arena-prod-db
          property: connectionString

databases:
  - name: snake-arena-prod-db
    plan: free
    databaseName: snake_arena
    user: snake
